name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: pnpm run build
        env:
          # Repository variables (Settings → Secrets and variables → Actions → Variables).
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://vvake.com' }}
          NEXT_PUBLIC_WAITLIST_ENDPOINT: ${{ vars.WAITLIST_ENDPOINT }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
          # Ship out/.well-known/apple-app-site-association (universal links); the action skips dot-folders otherwise.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # A red deploy must be seen the same day. GitHub e-mails the person who pushed only if their notification settings
  # allow it (README "Deploy"), so this job also keeps one open issue "Site deploy failing" while main is red
  # (repository watchers get an e-mail for it) and closes it on the next green deploy. GitHub only, no other service.
  report:
    needs: [build, deploy]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Site deploy failing
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
      PASSED: ${{ needs.build.result == 'success' && needs.deploy.result == 'success' }}
    steps:
      - name: Open, update or close the deploy issue
        run: |
          open="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)"
          if [ "$FAILED" = "true" ]; then
            body="The deploy of \`$SHA\` failed: $RUN_URL"$'\n\n'"The site still serves the last good build. Fix main (often \`pnpm run format\`, then \`pnpm run check\`), push, and this issue closes itself on the next green deploy."
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "$TITLE" --body "$body"; fi
          elif [ "$PASSED" = "true" ] && [ -n "$open" ]; then
            gh issue close "$open" --comment "Fixed: \`$SHA\` deployed ($RUN_URL)."
          fi
